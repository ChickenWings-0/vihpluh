name: Release

# A pushed tag `vX.Y.Z` builds the Windows installer, the portable zip, and the Fedora RPM,
# and opens a *draft* release with them and their checksums. Publishing the draft is a
# manual step. Needs no secrets beyond the workflow's own token.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows installer and portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch libmpv
        run: pnpm fetch:libmpv

      - name: Build the installer
        run: pnpm tauri build --bundles nsis
      - name: Pack the portable zip
        run: pnpm package:portable

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/portable/*.zip out/
          Get-ChildItem out | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/
          if-no-files-found: error

  fedora:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            webkit2gtk4.1-devel openssl-devel curl wget file git \
            libappindicator-gtk3-devel librsvg2-devel libxdo-devel \
            gtk3-devel libepoxy-devel wayland-devel mesa-libEGL-devel \
            mpv-devel clang-devel nodejs rpm-build \
            gcc gcc-c++ make pkgconf-pkg-config
          npm install --global pnpm@9

      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the RPM
        run: pnpm tauri build --bundles rpm

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/rpm/*.rpm out/
          cd out && for f in *.rpm; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: out/
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [windows, fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --draft \
            --title "vihpluh ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
