# VLC-style keymap (KEYBINDS_AND_CONFIG §2 "Built-in alternative keymaps"): VLC's stock
# hotkeys mapped onto vihpluh's actions. Actions VLC has no key for are unbound.
# Compiled into the binary; a user's keybinds.toml layers on top.
schema = 1

[bind]
# ── Playback ────────────────────────────────────────────────────────────────
"player.toggle_pause"         = ["Space"]
"player.stop"                 = ["S"]
"player.seek_back_small"      = ["Alt+Left"]
"player.seek_forward_small"   = ["Alt+Right"]
"player.seek_back_medium"     = ["Ctrl+Left"]
"player.seek_forward_medium"  = ["Ctrl+Right"]
"player.seek_back_large"      = ["Ctrl+Alt+Left"]
"player.seek_forward_large"   = ["Ctrl+Alt+Right"]
"player.seek_back_exact"      = ["Shift+Left"]
"player.seek_forward_exact"   = ["Shift+Right"]
"player.seek_percent_0"       = []
"player.seek_percent_1"       = []
"player.seek_percent_2"       = []
"player.seek_percent_3"       = []
"player.seek_percent_4"       = []
"player.seek_percent_5"       = []
"player.seek_percent_6"       = []
"player.seek_percent_7"       = []
"player.seek_percent_8"       = []
"player.seek_percent_9"       = []
"player.seek_start"           = []
"player.frame_step_back"      = []
"player.frame_step_forward"   = ["E"]
"player.speed_down"           = ["[", "-"]
"player.speed_up"             = ["]", "Shift+="]
"player.speed_halve"          = []
"player.speed_double"         = []
"player.speed_reset"          = ["="]
"player.toggle_reverse"       = []
"player.volume_up"            = ["Ctrl+Up", "WheelUp"]
"player.volume_down"          = ["Ctrl+Down", "WheelDown"]
"player.volume_up_fine"       = []
"player.volume_down_fine"     = []
"player.toggle_mute"          = ["M"]
"player.ab_loop_cycle"        = ["Shift+L"]
"player.sleep_timer_cycle"    = []
"player.screenshot"           = ["Shift+S"]
"player.screenshot_clean"     = []
"player.show_progress"        = ["T"]

# ── Queue, chapters, bookmarks ──────────────────────────────────────────────
"queue.next"                  = ["N", "MediaTrackNext"]
"queue.previous"              = ["P", "MediaTrackPrevious"]
"queue.toggle_panel"          = ["Ctrl+L"]
"queue.cycle_repeat"          = ["L"]
"queue.toggle_shuffle"        = ["R"]
"queue.stop_after_current"    = []
"queue.clear"                 = []
"queue.save_as_playlist"      = []
"markers.next"                = ["Shift+N"]
"markers.previous"            = ["Shift+P"]
"bookmarks.add"               = []
"bookmarks.toggle_panel"      = ["Ctrl+B"]

# ── Audio ───────────────────────────────────────────────────────────────────
"audio.cycle_track"           = ["B"]
"audio.cycle_device"          = ["Shift+A"]
"audio.delay_decrease"        = ["J"]
"audio.delay_increase"        = ["K"]
"audio.delay_reset"           = []
"audio.toggle_equalizer"      = []
"audio.toggle_normalize"      = []

# ── Subtitles ───────────────────────────────────────────────────────────────
"subtitles.cycle_track"       = ["V"]
"subtitles.toggle_visibility" = ["Shift+V"]
"subtitles.delay_decrease"    = ["G"]
"subtitles.delay_increase"    = ["H"]
"subtitles.sync_previous_cue" = []
"subtitles.sync_next_cue"     = []
"subtitles.delay_reset"       = []
"subtitles.size_decrease"     = []
"subtitles.size_increase"     = []
"subtitles.position_up"       = []
"subtitles.position_down"     = []
"subtitles.add_file"          = []
"subtitles.automatch"         = []

# ── Video ───────────────────────────────────────────────────────────────────
"video.cycle_aspect"          = ["A"]
"video.toggle_fill"           = ["C"]
"video.rotate_cw"             = []
"video.flip_horizontal"       = []
"video.flip_vertical"         = []
"video.zoom_in"               = ["Z"]
"video.zoom_out"              = ["Shift+Z"]
"video.reset_transform"       = []
"video.toggle_deband"         = []
"video.cycle_tone_mapping"    = []

# ── Window and interface ────────────────────────────────────────────────────
"window.toggle_fullscreen"    = ["F", "F11", "MouseLeftDouble"]
"window.toggle_pip"           = []
"window.toggle_zen"           = ["Ctrl+H"]
"window.toggle_always_on_top" = []
"window.minimize"             = []
"ui.escape"                   = ["Escape"]
"ui.toggle_sidebar"           = ["Ctrl+E"]
"ui.sidebar_subtitles"        = []
"ui.sidebar_audio"            = []
"ui.sidebar_video"            = []
"ui.sidebar_playback"         = []
"ui.sidebar_bookmarks"        = []
"ui.toggle_inspector"         = ["Ctrl+J"]
"ui.toggle_library"           = []
"ui.open_settings"            = ["Ctrl+P"]
"ui.show_shortcuts"           = ["F1"]
"ui.command_palette"          = []
"ui.context_menu"             = ["MouseRight", "ContextMenu", "Shift+F10"]
"app.open_file"               = ["Ctrl+O"]
"app.open_folder"             = ["Ctrl+F"]
"app.open_url"                = ["Ctrl+N"]
"app.paste_and_play"          = ["Ctrl+V"]
"app.reveal_current"          = []
"presets.save_current"        = []
"presets.update_current"      = []
"app.quit"                    = ["Ctrl+Q"]

# ── Context-scoped (§2 "Context-scoped actions") ────────────────────────────
[context.queue.bind]
"queue.play_selected"         = ["Enter"]
"queue.remove_selected"       = ["Delete"]
"queue.move_selected_up"      = ["Alt+Up"]
"queue.move_selected_down"    = ["Alt+Down"]
"queue.select_all"            = ["Ctrl+A"]

[context.library.bind]
"library.play_selected"       = ["Enter"]
"library.play_next_selected"  = ["Shift+Enter"]
"library.enqueue_selected"    = ["Ctrl+Enter"]
"library.focus_search"        = ["Ctrl+F", "/"]
"library.go_up"               = ["Backspace"]

[context.bookmarks.bind]
"bookmarks.rename_selected"   = ["F2"]
"bookmarks.remove_selected"   = ["Delete"]

[context.settings.bind]
"settings.focus_search"       = ["Ctrl+F", "/"]
