# mpv-style keymap (KEYBINDS_AND_CONFIG §2 "Built-in alternative keymaps"): mpv's stock
# input.conf mapped onto vihpluh's actions. Actions mpv has no key for are unbound.
# Compiled into the binary; a user's keybinds.toml layers on top.
schema = 1

[bind]
# ── Playback ────────────────────────────────────────────────────────────────
"player.toggle_pause"         = ["Space", "P", "MouseRight"]
"player.stop"                 = []
"player.seek_back_small"      = ["Left"]
"player.seek_forward_small"   = ["Right"]
"player.seek_back_medium"     = ["WheelLeft"]
"player.seek_forward_medium"  = ["WheelRight"]
"player.seek_back_large"      = ["Down"]
"player.seek_forward_large"   = ["Up"]
"player.seek_back_exact"      = ["Shift+Left"]
"player.seek_forward_exact"   = ["Shift+Right"]
"player.seek_percent_0"       = []
"player.seek_percent_1"       = []
"player.seek_percent_2"       = []
"player.seek_percent_3"       = []
"player.seek_percent_4"       = []
"player.seek_percent_5"       = []
"player.seek_percent_6"       = []
"player.seek_percent_7"       = []
"player.seek_percent_8"       = []
"player.seek_percent_9"       = []
"player.seek_start"           = []
"player.frame_step_back"      = [","]
"player.frame_step_forward"   = ["."]
"player.speed_down"           = ["["]
"player.speed_up"             = ["]"]
"player.speed_halve"          = ["Shift+["]
"player.speed_double"         = ["Shift+]"]
"player.speed_reset"          = ["Backspace"]
"player.toggle_reverse"       = []
"player.volume_up"            = ["0", "Shift+8", "WheelUp"]
"player.volume_down"          = ["9", "/", "WheelDown"]
"player.volume_up_fine"       = []
"player.volume_down_fine"     = []
"player.toggle_mute"          = ["M"]
"player.ab_loop_cycle"        = ["L"]
"player.sleep_timer_cycle"    = []
"player.screenshot"           = ["S"]
"player.screenshot_clean"     = ["Shift+S"]
"player.show_progress"        = ["O"]

# ── Queue, chapters, bookmarks ──────────────────────────────────────────────
"queue.next"                  = ["Shift+.", "Enter", "MouseForward", "MediaTrackNext"]
"queue.previous"              = ["Shift+,", "MouseBack", "MediaTrackPrevious"]
"queue.toggle_panel"          = []
"queue.cycle_repeat"          = []
"queue.toggle_shuffle"        = []
"queue.stop_after_current"    = []
"queue.clear"                 = []
"queue.save_as_playlist"      = []
"markers.next"                = ["PageUp"]
"markers.previous"            = ["PageDown"]
"bookmarks.add"               = []
"bookmarks.toggle_panel"      = []

# ── Audio ───────────────────────────────────────────────────────────────────
"audio.cycle_track"           = ["Shift+3"]
"audio.cycle_device"          = []
"audio.delay_decrease"        = ["Ctrl+-"]
"audio.delay_increase"        = ["Ctrl+Shift+="]
"audio.delay_reset"           = []
"audio.toggle_equalizer"      = []
"audio.toggle_normalize"      = []

# ── Subtitles ───────────────────────────────────────────────────────────────
"subtitles.cycle_track"       = ["J"]
"subtitles.toggle_visibility" = ["V"]
"subtitles.delay_decrease"    = ["Z"]
"subtitles.delay_increase"    = ["Shift+Z", "X"]
"subtitles.sync_previous_cue" = ["Ctrl+Shift+Left"]
"subtitles.sync_next_cue"     = ["Ctrl+Shift+Right"]
"subtitles.delay_reset"       = []
"subtitles.size_decrease"     = ["Shift+F"]
"subtitles.size_increase"     = ["Shift+G"]
"subtitles.position_up"       = ["R"]
"subtitles.position_down"     = ["T"]
"subtitles.add_file"          = []
"subtitles.automatch"         = []

# ── Video ───────────────────────────────────────────────────────────────────
"video.cycle_aspect"          = ["Shift+A"]
"video.toggle_fill"           = ["Shift+W"]
"video.rotate_cw"             = []
"video.flip_horizontal"       = []
"video.flip_vertical"         = []
"video.zoom_in"               = ["Alt+Shift+="]
"video.zoom_out"              = ["Alt+-"]
"video.reset_transform"       = ["Alt+Backspace"]
"video.toggle_deband"         = []
"video.cycle_tone_mapping"    = []

# ── Window and interface ────────────────────────────────────────────────────
"window.toggle_fullscreen"    = ["F", "MouseLeftDouble"]
"window.toggle_pip"           = []
"window.toggle_zen"           = []
"window.toggle_always_on_top" = ["Shift+T"]
"window.minimize"             = []
"ui.escape"                   = ["Escape"]
"ui.toggle_sidebar"           = []
"ui.sidebar_subtitles"        = []
"ui.sidebar_audio"            = []
"ui.sidebar_video"            = []
"ui.sidebar_playback"         = []
"ui.sidebar_bookmarks"        = []
"ui.toggle_inspector"         = ["I", "Shift+I"]
"ui.toggle_library"           = []
"ui.open_settings"            = []
"ui.show_shortcuts"           = []
"ui.command_palette"          = []
"ui.context_menu"             = ["ContextMenu", "Shift+F10"]
"app.open_file"               = []
"app.open_folder"             = []
"app.open_url"                = []
"app.paste_and_play"          = []
"app.reveal_current"          = []
"presets.save_current"        = []
"presets.update_current"      = []
"app.quit"                    = ["Q"]

# ── Context-scoped (§2 "Context-scoped actions") ────────────────────────────
[context.queue.bind]
"queue.play_selected"         = ["Enter"]
"queue.remove_selected"       = ["Delete"]
"queue.move_selected_up"      = ["Alt+Up"]
"queue.move_selected_down"    = ["Alt+Down"]
"queue.select_all"            = ["Ctrl+A"]

[context.library.bind]
"library.play_selected"       = ["Enter"]
"library.play_next_selected"  = ["Shift+Enter"]
"library.enqueue_selected"    = ["Ctrl+Enter"]
"library.focus_search"        = ["Ctrl+F", "/"]
"library.go_up"               = ["Backspace"]

[context.bookmarks.bind]
"bookmarks.rename_selected"   = ["F2"]
"bookmarks.remove_selected"   = ["Delete"]

[context.settings.bind]
"settings.focus_search"       = ["Ctrl+F", "/"]
