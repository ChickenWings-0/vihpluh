# vihpluh default keymap (KEYBINDS_AND_CONFIG §2). Compiled into the binary.
# Keys are physical US-layout positions (§3.1). A user's keybinds.toml layers on top of this.
schema = 1

[bind]
# ── Playback ────────────────────────────────────────────────────────────────
"player.toggle_pause"         = ["Space", "K", "MouseLeft"]
"player.stop"                 = ["Ctrl+W"]
"player.seek_back_small"      = ["Left", "Shift+WheelDown"]
"player.seek_forward_small"   = ["Right", "Shift+WheelUp"]
"player.seek_back_medium"     = ["J"]
"player.seek_forward_medium"  = ["L"]
"player.seek_back_large"      = ["Ctrl+Left"]
"player.seek_forward_large"   = ["Ctrl+Right"]
"player.seek_back_exact"      = ["Shift+Left"]
"player.seek_forward_exact"   = ["Shift+Right"]
"player.seek_percent_0"       = ["0"]
"player.seek_percent_1"       = ["1"]
"player.seek_percent_2"       = ["2"]
"player.seek_percent_3"       = ["3"]
"player.seek_percent_4"       = ["4"]
"player.seek_percent_5"       = ["5"]
"player.seek_percent_6"       = ["6"]
"player.seek_percent_7"       = ["7"]
"player.seek_percent_8"       = ["8"]
"player.seek_percent_9"       = ["9"]
"player.seek_start"           = ["Home"]
"player.frame_step_back"      = [","]
"player.frame_step_forward"   = ["."]
"player.speed_down"           = ["["]
"player.speed_up"             = ["]"]
"player.speed_halve"          = ["Shift+["]
"player.speed_double"         = ["Shift+]"]
"player.speed_reset"          = ["Backspace"]
"player.toggle_reverse"       = []
"player.volume_up"            = ["Up", "WheelUp"]
"player.volume_down"          = ["Down", "WheelDown"]
"player.volume_up_fine"       = ["Shift+Up"]
"player.volume_down_fine"     = ["Shift+Down"]
"player.toggle_mute"          = ["M"]
"player.ab_loop_cycle"        = ["Shift+L"]
"player.sleep_timer_cycle"    = ["Ctrl+T"]
"player.screenshot"           = ["S"]
"player.screenshot_clean"     = ["Shift+S"]
"player.show_progress"        = ["O"]

# ── Queue, chapters, bookmarks ──────────────────────────────────────────────
"queue.next"                  = ["N", "MouseForward", "MediaTrackNext"]
"queue.previous"              = ["P", "MouseBack", "MediaTrackPrevious"]
"queue.toggle_panel"          = ["Q"]
"queue.cycle_repeat"          = ["R"]
"queue.toggle_shuffle"        = ["Shift+R"]
"queue.stop_after_current"    = []
"queue.clear"                 = []
"queue.save_as_playlist"      = []
"markers.next"                = ["PageDown", "Shift+N"]
"markers.previous"            = ["PageUp", "Shift+P"]
"bookmarks.add"               = ["Ctrl+B"]
"bookmarks.toggle_panel"      = ["B"]

# ── Audio ───────────────────────────────────────────────────────────────────
"audio.cycle_track"           = ["A"]
"audio.cycle_device"          = ["Shift+A"]
"audio.delay_decrease"        = ["Ctrl+-"]
"audio.delay_increase"        = ["Ctrl+="]
"audio.delay_reset"           = []
"audio.toggle_equalizer"      = ["E"]
"audio.toggle_normalize"      = []

# ── Subtitles ───────────────────────────────────────────────────────────────
"subtitles.cycle_track"       = ["V"]
"subtitles.toggle_visibility" = ["Shift+V"]
"subtitles.delay_decrease"    = ["G"]
"subtitles.delay_increase"    = ["H"]
"subtitles.sync_previous_cue" = ["Ctrl+G"]
"subtitles.sync_next_cue"     = ["Ctrl+H"]
"subtitles.delay_reset"       = ["Alt+G"]
"subtitles.size_decrease"     = ["Alt+-"]
"subtitles.size_increase"     = ["Alt+="]
"subtitles.position_up"       = ["Alt+Up"]
"subtitles.position_down"     = ["Alt+Down"]
"subtitles.add_file"          = ["Alt+V"]
"subtitles.automatch"         = []

# ── Video ───────────────────────────────────────────────────────────────────
"video.cycle_aspect"          = ["X"]
"video.toggle_fill"           = ["C"]
"video.rotate_cw"             = ["Ctrl+R"]
"video.flip_horizontal"       = []
"video.flip_vertical"         = []
"video.zoom_in"               = ["=", "Ctrl+WheelUp"]
"video.zoom_out"              = ["-", "Ctrl+WheelDown"]
"video.reset_transform"       = ["Shift+Backspace"]
"video.toggle_deband"         = []
"video.cycle_tone_mapping"    = []

# ── Window and interface ────────────────────────────────────────────────────
"window.toggle_fullscreen"    = ["F", "F11", "MouseLeftDouble"]
"window.toggle_pip"           = ["Ctrl+P"]
"window.toggle_zen"           = ["Z", "MouseMiddle"]
"window.toggle_always_on_top" = ["T"]
"window.minimize"             = []
"ui.escape"                   = ["Escape"]
"ui.toggle_sidebar"           = ["\\"]
"ui.sidebar_subtitles"        = ["Alt+1"]
"ui.sidebar_audio"            = ["Alt+2"]
"ui.sidebar_video"            = ["Alt+3"]
"ui.sidebar_playback"         = ["Alt+4"]
"ui.sidebar_bookmarks"        = ["Alt+5"]
"ui.toggle_inspector"         = ["I"]
"ui.toggle_library"           = ["Ctrl+L"]
"ui.open_settings"            = ["Ctrl+,"]
"ui.show_shortcuts"           = ["F1", "Shift+/"]
"ui.command_palette"          = ["Ctrl+Shift+P"]
"ui.context_menu"             = ["MouseRight", "ContextMenu", "Shift+F10"]
"app.open_file"               = ["Ctrl+O"]
"app.open_folder"             = ["Ctrl+Shift+O"]
"app.open_url"                = ["Ctrl+N"]
"app.paste_and_play"          = ["Ctrl+V"]
"app.reveal_current"          = []
"presets.save_current"        = ["Ctrl+S"]
"presets.update_current"      = []
"app.quit"                    = ["Ctrl+Q"]

# ── Context-scoped (§2 "Context-scoped actions") ────────────────────────────
[context.queue.bind]
"queue.play_selected"         = ["Enter"]
"queue.remove_selected"       = ["Delete"]
"queue.move_selected_up"      = ["Alt+Up"]
"queue.move_selected_down"    = ["Alt+Down"]
"queue.select_all"            = ["Ctrl+A"]

[context.library.bind]
"library.play_selected"       = ["Enter"]
"library.play_next_selected"  = ["Shift+Enter"]
"library.enqueue_selected"    = ["Ctrl+Enter"]
"library.focus_search"        = ["Ctrl+F", "/"]
"library.go_up"               = ["Backspace"]

[context.bookmarks.bind]
"bookmarks.rename_selected"   = ["F2"]
"bookmarks.remove_selected"   = ["Delete"]

[context.settings.bind]
"settings.focus_search"       = ["Ctrl+F", "/"]
